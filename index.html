/* equipo (gerente) */
#eq{display:none}body.wide #eq{display:block}body.wide .app{display:none}body.wide{padding:0}
.eqh{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.eqh .t{font-weight:800;font-size:19px}.eqh .s{font-size:12px;color:#9db0c2}.eqh .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eqh button,.eqh select{background:#ffffff1a;color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}.eqh select option{color:#000}.eqh button.m{background:var(--mint);color:var(--green)}
.eqb{max-width:1280px;margin:0 auto;padding:14px 16px 40px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kp>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kp .l{font-size:10.5px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.05em}.kp .v{font-size:24px;font-weight:800}.kp .d{font-size:11px;color:var(--mut)}
.gg{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.pn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}.pn h4{font-size:13px;margin-bottom:8px}
table.g{width:100%;border-collapse:collapse;font-size:12.5px}table.g th{font-size:10.5px;text-transform:uppercase;color:var(--mut);text-align:left;border-bottom:2px solid var(--line);padding:6px}table.g td{padding:7px 6px;border-bottom:1px solid var(--line)}
table.g td a{color:var(--navy);font-weight:800;cursor:pointer}.hm{display:inline-block;width:26px;height:18px;border-radius:4px;margin-right:2px;font-size:10px;text-align:center;line-height:18px;font-weight:700}
.li{font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}.li:last-child{border:0}.li b{color:var(--ink)}.li span{color:var(--mut)}
@media(max-width:900px){.kp{grid-template-columns:1fr 1fr}.gg{grid-template-columns:1fr}}
</style></head><body>

const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], DIA=['dom','lun','mar','mié','jue','vie','sáb'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dt=s=>new Date(String(s).slice(0,10)+'T12:00:00');
const HOY=iso(new Date());
const fd=s=>{if(!s)return'—';const d=dt(s);return DIA[d.getDay()]+' '+d.getDate()+'-'+MES[d.getMonth()]};
const add=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);while(d.getDay()==0||d.getDay()==6)d.setDate(d.getDate()+(n<0?-1:1));return iso(d)};
const lunes=s=>{const d=dt(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const masDias=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};

 ${E.map(e=>{const c=cl.filter(x=>x.ej===e),a=c.filter(x=>ALT.includes(x.tipo));return `<tr><td><a onclick='EJ="${jq(e)}";ls.set("bp_ej",EJ);vista="dia";pinta()'>${esc(e)}</a></td><td>${c.length}</td><td>${a.length}</td><td>${a.filter(x=>vis30.has(e+'|'+x.cli)).length}</td><td>${sem.map(s=>{const n=nW(e,s);return `<span class="hm" style="background:${col(n)}">${n}</span>`}).join('')}</td><td>${atr.filter(k=>k.ej===e).length||''}</td></tr>`}).join('')}</table></div>
 <div class="pn"><h4>Alertas sin visita en 30 días · ${al.length-alv.length}</h4>${li(al.filter(c=>!vis30.has(c.ej+'|'+c.cli)).sort((a,b)=>(b.v12||0)-(a.v12||0)).slice(0,15),c=>`<div class="li"><b>${esc(c.nombre)}</b> <span>· ${esc(c.ej)} · ${esc(c.tipo)} · ${fm(c.v12)} en 12 m</span></div>`,'Todas visitadas')}</div>

function csv(){const cols=['fecha','sucursal','vendedor','cliente','nombre','a_que_fue','contacto','resultado','detalle','producto','m2','motivo','mes','etapa','cobranza','competidor','siguiente','fecha_siguiente','comentario'];

 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+cols.join(',')+'\n'+rows.join('\n')],{type:'text/csv'}));a.download=`BP_${PLAZA}_${HOY}.csv`;a.click()}
