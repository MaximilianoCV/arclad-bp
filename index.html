<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=DM+Serif+Text&display=swap" rel="stylesheet">
<style>

:root{--navy:#0d1b2e;--teal:#009072;--mint:#31EB97;--green:#003D2D;--red:#c0392b;--amb:#c9963a;--ink:#10202e;--body:#39485a;--mut:#7b8a99;--line:#e3e8ec;--bg:#e9edf0;--soft:#f4f7f8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:Archivo,'Segoe UI',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
header{background:var(--navy);color:#fff;padding:18px 24px}
header small{color:var(--mint);font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700}
header h1{font-family:'DM Serif Text',serif;font-weight:400;font-size:26px}
header p{color:#9db0c2;font-size:13px;max-width:110ch;margin-top:4px}
.stage{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;padding:26px 16px 10px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;width:360px}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.lbl span{display:inline-block;background:var(--navy);color:var(--mint);border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;margin-right:6px}
.cap{font-size:12.5px;color:var(--body);text-align:center;max-width:330px;min-height:36px}
.phone{width:360px;height:740px;background:#fff;border-radius:38px;border:10px solid #111;box-shadow:0 18px 40px rgba(10,20,32,.25);overflow:hidden;display:flex;flex-direction:column;position:relative}
.sb{height:26px;background:var(--navy);color:#fff;font-size:11px;display:flex;justify-content:space-between;padding:6px 18px 0}
.ah{background:var(--navy);color:#fff;padding:8px 16px 12px}
.ah .t{font-weight:800;font-size:17px}.ah .s{font-size:11.5px;color:#9db0c2}
.ah .back{font-size:12px;color:var(--mint);cursor:pointer;margin-bottom:2px}
.scr{flex:1;overflow-y:auto;padding:12px 12px 80px}
.scr::-webkit-scrollbar{width:0}
.prog{background:#ffffff1a;border-radius:6px;height:7px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--mint)}
.sec{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:12px 4px 6px}
.it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.15s}
.it:hover{border-color:var(--teal)}.it.sel{border-color:var(--teal);box-shadow:0 0 0 2px #00907233}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.it .n{font-weight:700;font-size:13.5px}.it .m{font-size:11.5px;color:var(--mut)}
.it .r{margin-left:auto;text-align:right;font-size:11px;color:var(--mut);white-space:nowrap}.it .r b{display:block;color:var(--ink);font-size:13px}
.ok{color:var(--teal);font-weight:800;font-size:16px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:10px}
.b-red{background:#fbe9e7;color:var(--red)}.b-amb{background:#fbf3e3;color:#8a5a00}.b-grn{background:#e3f6ee;color:var(--green)}.b-gry{background:#eef1f4;color:var(--mut)}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.tile{background:var(--soft);border-radius:10px;padding:8px}.tile .l{font-size:9.5px;color:var(--mut);text-transform:uppercase;font-weight:700;letter-spacing:.05em}.tile .v{font-weight:800;font-size:15px}.tile .d{font-size:10px;color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.card h4{font-size:12px;font-weight:800;margin-bottom:6px}
.pr{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)}.pr:last-child{border:0}.pr span:last-child{color:var(--mut)}
.chipsro span{display:inline-block;font-size:11px;padding:3px 9px;border-radius:12px;background:var(--soft);margin:2px 2px 0 0}
.chipsro.hue span{background:#e7eefc;color:#1F426E}
.bar{height:8px;background:#eef1f4;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
.plan{background:#eef8f4;border-left:3px solid var(--teal);border-radius:0 10px 10px 0;padding:8px 10px;font-size:12px;color:#1b4a3c}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--teal);color:#fff;font-weight:800;font-size:15px;padding:14px;cursor:pointer;font-family:inherit}
.btn:disabled{background:#b9c6cf;cursor:default}
.foot{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 14px;background:linear-gradient(#fff0,#fff 30%)}

.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.bad.on{background:var(--red);border-color:var(--red)}
.hide{display:none}
.step{display:flex;align-items:center;gap:10px}.step button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;cursor:pointer}.step b{font-size:18px;min-width:90px;text-align:center}
.mic{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--mut);cursor:pointer}

.done{text-align:center;padding:20px 8px}.done .ck{width:70px;height:70px;border-radius:50%;background:var(--mint);color:var(--green);font-size:38px;line-height:70px;margin:0 auto 10px;font-weight:800}

.days{display:flex;gap:5px;margin:4px 0 8px}.days button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 0;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;color:var(--ink)}.days button small{display:block;font-size:10px;color:var(--mut);font-weight:600}.days button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.days button.on small{color:var(--mint)}
.ag{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:12px}.ag .h{font-weight:800;color:var(--teal);min-width:46px;font-size:11px}.ag .x{margin-left:auto;color:var(--mut);cursor:pointer;font-size:16px}
.add{margin-left:auto;border:1.5px solid var(--teal);color:var(--teal);background:#fff;border-radius:16px;padding:5px 10px;font-weight:800;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:10px 14px 16px;transform:translateY(105%);transition:.25s;z-index:5;max-height:82%;overflow-y:auto}.sheet.on{transform:none}
.grab{width:40px;height:5px;background:#d5dbe0;border-radius:3px;margin:0 auto 8px}
.shade{position:absolute;inset:0;background:#0d1b2e66;opacity:0;pointer-events:none;transition:.25s;z-index:4}.shade.on{opacity:1;pointer-events:auto}
.empty{font-size:12px;color:var(--mut);text-align:center;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:6px}
.why{font-size:10.5px;color:var(--mut)}
.dash{max-width:1300px;margin:18px auto 6px;padding:0 16px}
.laptop{background:#111;border-radius:18px 18px 6px 6px;padding:12px 12px 16px;box-shadow:0 18px 40px rgba(10,20,32,.25)}
.screen{background:#f4f6f8;border-radius:8px;overflow:hidden}
.dh{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}.dh .t{font-weight:800;font-size:18px}.dh .s{font-size:12px;color:#9db0c2}
.dh .sel{margin-left:auto;display:flex;gap:6px}.dh .sel span{background:#ffffff1a;border-radius:8px;padding:5px 10px;font-size:12px}
.dk{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 16px 4px}

.pn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}.pn h5{font-size:12.5px;font-weight:800;margin-bottom:2px}.pn .k{font-size:10.5px;color:var(--mut);margin-bottom:6px}
.src{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:8px;margin-left:4px;vertical-align:middle}.src.r{background:#e3f6ee;color:var(--green)}.src.e{background:#fbf3e3;color:#8a5a00}.src.lv{background:#e7eefc;color:#1F426E}
.pn table{width:100%;border-collapse:collapse;font-size:11.5px}.pn td,.pn th{padding:5px 4px;border-bottom:1px solid #eef1f4;text-align:left}.pn th{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.pn td.n,.pn th.n{text-align:right}
.dash .intro{display:flex;align-items:center;gap:10px;margin-bottom:10px}.dash .intro .lbl span{display:inline-block;background:var(--navy);color:var(--mint);border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;margin-right:6px}
@media(max-width:1000px){.dk{grid-template-columns:repeat(2,1fr)}.dg{grid-template-columns:1fr}}
.notes{max-width:1180px;margin:10px auto 40px;padding:0 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.notes div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--body)}
.notes h3{font-family:'DM Serif Text',serif;font-weight:400;font-size:18px;color:var(--ink);margin-bottom:6px}
.notes li{margin:4px 0 4px 16px}
@media(max-width:900px){.notes{grid-template-columns:1fr}}
@media(max-width:400px){.col,.phone{width:100%}}

/* ---- app real: un solo teléfono que navega entre las pantallas del mockup ---- */
body{min-height:100vh}
.app{width:100%;max-width:420px;height:100vh;height:100dvh;margin:0 auto;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;overflow:clip}
.sheet:not(.on){visibility:hidden}

.ah .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.ah .who{font-size:11px;color:var(--mint);cursor:pointer;white-space:nowrap;margin-top:3px}
.scr{padding-bottom:150px}

.nav button i{font-style:normal;font-size:18px}.nav button.on{color:var(--teal)}

.line .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.line .top b{font-size:13px}.line .x{border:0;background:none;color:var(--red);font-size:18px;cursor:pointer}
.line .q{margin-top:8px}
.step input{width:110px;text-align:center;font-size:18px;font-weight:800;border:1.5px solid var(--line);border-radius:10px;height:38px;font-family:inherit}
.chip.fm.on{background:var(--amb);border-color:var(--amb);color:#fff}
input.t,textarea.t{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13px;font-family:inherit;margin-top:6px}
.addp{display:block;width:100%;border:1.5px dashed var(--teal);color:var(--teal);background:#fff;border-radius:14px;padding:10px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;margin-top:4px}
.hist{font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line)}.hist:last-child{border:0}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:9;white-space:nowrap}
.login{padding:30px 18px}.login .q{font-size:15px}.login .chip{width:100%;text-align:left;margin-bottom:6px}
.load{padding:60px 20px;text-align:center;color:var(--mut);font-size:13px}
/* junta: pantalla ancha */
#junta{display:none;padding:0 0 30px}body.wide #junta{display:block}body.wide .app{display:none}body.wide{padding:0}

<script>
// ---------- conexión: Apps Script (google.script.run dentro de Google; fetch a /exec desde la PWA) ----------
const API='https://script.google.com/macros/s/AKfycbyjZkPCE_3q40zMWIqY7RzjNAzVgfNvu3dwSBXjwkQFtv7lPqHY-_dqWykVqTAATFeYMQ/exec';
const api=(fn,...a)=>window.google&&google.script?new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a))
 :fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})}).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error);return j.r});
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
// ---------- constantes del mockup ----------
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fm=v=>v==null?'—':(Math.abs(v)>=1e6?'$'+(v/1e6).toFixed(1)+' M':'$'+Math.round(v/1e3).toLocaleString('es-MX')+' K');
const pc=v=>v==null||isNaN(v)?'—':((v-1)*100>=0?'+':'')+Math.round((v-1)*100)+' %';
const fd=s=>{if(!s)return'—';const[y,m,d]=String(s).slice(0,10).split('-');return +d+'-'+MES[+m-1]};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MOT={'Dejó de comprar':c=>`${c.dias} días sin comprar`,'Cayó fuerte':c=>`compra ${pc(c.vsP)} vs su promedio`,'Creció fuerte':c=>`compra ${pc(c.vsP)} · ¿proyecto?`,'Sigue, pero dejó una categoría':c=>`dejó ${(c.cat_dejo||'').toLowerCase()}`,'En su tendencia':c=>'recompra normal','Bajó, pero igual que el año pasado (estacional probable)':c=>'bajó como el año pasado (estacional)'};
const BAD={'Dejó de comprar':'b-red','Cayó fuerte':'b-red','Creció fuerte':'b-grn','Sigue, pero dejó una categoría':'b-amb','En su tendencia':'b-gry'};
const ALT=['Dejó de comprar','Cayó fuerte'];
MOT['Agregado']=c=>c.origen==='Prospecto'?'prospecto nuevo':'agregado por ti'+(c.ej_sae&&c.ej_sae!==c.ej?' · lo lleva: '+c.ej_sae:'');BAD['Agregado']='b-gry';
const OBJ={'Dejó de comprar':'Recuperar cliente','Cayó fuerte':'Seguimiento','Creció fuerte':'Proyecto','Sigue, pero dejó una categoría':'Venta cruzada','En su tendencia':'Seguimiento'};
const OBJS=['Seguimiento','Entrega de muestras','Proyecto','Cobranza','Reclamación','Recuperar cliente','Venta cruzada','Presentación (nuevo)'];
const esc_=c=>c.v12>=5e6?'A':(c.v12>=1e6?'B':'C');
const FREQ={A:'cada 2 semanas',B:'mensual',C:'trimestral'};
const why=c=>ALT.includes(c.tipo)?'⚠ '+MOT[c.tipo](c)+' · visitar en ≤ 2 sem':(c.tipo==='En su tendencia'?esc_(c)+' · le toca '+FREQ[esc_(c)]:(MOT[c.tipo]||(()=>c.tipo))(c));
const dotc=c=>ALT.includes(c.tipo)?'var(--red)':(c.tipo==='En su tendencia'?'var(--teal)':'var(--amb)');
const RAZ=['Compró','Pedido en camino','Falta de material','Precio','Calidad','Crédito','Competidor','Estacional','Su negocio bajó','Otro','No aplica'];
const NA='No aplica',SIN_PROY=['No',NA];
const RAZ_MALA=['Precio','Calidad','Crédito','Competidor'];
const RAZ_VENTA=['Compró','Pedido en camino'];
// ---------- semana actual (lunes a viernes) ----------
const HOY=new Date();const LUN=new Date(HOY.getFullYear(),HOY.getMonth(),HOY.getDate()-((HOY.getDay()+6)%7));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const SEMANA=iso(LUN);const DIAS=['Lun','Mar','Mié','Jue','Vie'];
const FECH=DIAS.map((_,i)=>new Date(LUN.getFullYear(),LUN.getMonth(),LUN.getDate()+i).getDate());
const VIE=new Date(LUN.getFullYear(),LUN.getMonth(),LUN.getDate()+4);
const SEM_TXT=`${FECH[0]}${LUN.getMonth()!==VIE.getMonth()?' '+MES[LUN.getMonth()]:''}–${FECH[4]} ${MES[VIE.getMonth()]}`;
const MESES_PROX=[1,2,3,4].map(k=>{const m=MES[(HOY.getMonth()+k)%12];return m[0].toUpperCase()+m.slice(1)}).concat(['No sabe',NA]);
// ---------- estado ----------
let D=null,V=[],AGALL=[],CLAVE=ls.get('bp_clave',''),EJ=ls.get('bp_ej',''),scr='semana',cur=-1,F=null,taps=0,dia=Math.min(4,(HOY.getDay()+6)%7),SH=null,ultimo=null;
// ---------- clientes agregados y vendedor de prueba ----------
const PRUEBA='Vendedor Prueba';
const real=e=>e!==PRUEBA;
function mkCli(x){const m=D.clientes[0].meses;return {pz:'GD',tipo:'Agregado',plan:x.origen==='Prospecto'?'Prospecto nuevo: presentación y muestras':'Cliente agregado por el ejecutivo · sin análisis del piloto',

 await reenvia();if(silencio)toast('Actualizado');pinta()}

 document.getElementById('scr').innerHTML=`<div class="login"><div class="q">Clave de acceso</div>${mala?'<div style="color:var(--red);font-size:12px">Clave incorrecta</div>':''}<input class="t" id="clv" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entra()"><div style="height:12px"></div><button class="btn" onclick="entra()">Entrar</button></div>`}

 const q=ls.get('bp_cola',[]);if(!q.length)return;const resto=[];
 for(const b of q){try{const j=await api('guardar',CLAVE,b);if(j.ok){V=V.filter(v=>v.id!==b._tmp);V.unshift(j.item)}}catch(e){resto.push(b)}}
 ls.set('bp_cola',resto);if(q.length>resto.length)toast((q.length-resto.length)+' visita(s) pendiente(s) enviadas')}

  cs.forEach(([c,i])=>h+=`<div class="it" onclick="abre(${i})"><div class="dot" style="background:${dotc(c)}"></div><div style="min-width:0"><div class="n">${esc(c.nombre)}</div><div class="m">${i in ag?esc(ag[i].t+' · '+ag[i].o):esc((MOT[c.tipo]||(()=>c.tipo))(c))}</div></div><div class="r">${he.has(c.cli)?'<span class="ok">✓</span>':`<b>${fm(c.v12)}</b>12 m`}</div></div>`)});

 if(malas)h+=`<div class="q">¿Quién más le vende? <small>opcional · la lista la define Comercial</small></div>${chips(F.comp,['Competidor 1','Competidor 2','Competidor 3','Otro','No sé',NA],o=>`pick('comp','${o}')`)}`;

async function guarda(){const c=D.clientes[cur];document.getElementById('save').disabled=true;
 const b={ej:EJ,cli:c.cli,tipo:F.tipo,res:F.res,comp:F.comp,proy:F.proy,pet:F.pet,cob:F.cob,sig:F.sig,cuando:F.cuando,nota:F.nota,lineas:conProd()?F.lineas.filter(l=>l.prod):[]};
 let item;try{const j=await api('guardar',CLAVE,b);if(!j.ok)throw new Error(j.error);item=j.item}
 catch(e){b._tmp='local'+Date.now();const q=ls.get('bp_cola',[]);q.push(b);ls.set('bp_cola',q);item={...b,id:b._tmp,ts:new Date().toISOString()};toast('Sin señal: guardado en el teléfono, se envía solo')}
 V.unshift(item);ls.set('bp_cache',{D,V,AGALL});ultimo={c,v:item,taps};scr='listo';pinta()}
// ---------- 4 · Listo · a dónde va ----------
function s4(){const {c,v,taps:t}=ultimo;hdr('Guardado','se suma a su historial');const he=hechosDe(EJ),M=mis();const r=[];
 const L=v.lineas||[];const fmL=l=>`${l.prod} · ${Number(l.m2).toLocaleString('es-MX')} m²${l.mes?' · '+l.mes:''}`;
 r.push(['👤','Su historial',`${v.tipo} · ${v.res}. Se ve en el resumen la próxima vez.`]);
 const fmat=L.filter(l=>l.motivo==='Falta de material');if(fmat.length)r.push(['🚚','Compras · falta de material',fmat.map(fmL).join('<br>')+'<br>Se suma a la venta perdida por no tener el producto.']);
 const cal=L.filter(l=>l.motivo==='Calidad');if(cal.length)r.push(['🧪','Calidad',`Entra a la lista del mes: ${esc(c.nombre)}, ${cal.map(l=>l.prod).join(', ')}, ${fm(c.v12)} al año en juego.`]);
 if(L.some(l=>l.motivo==='Crédito'))r.push(['💳','Crédito',`Caso para revisar: saldo ${fm(c.saldo)} de ${fm(c.lim)}.`]);
 if(L.some(l=>['Precio','Competidor'].includes(l.motivo))||v.comp)r.push(['🏷️','Comercial',`Competidor: ${esc(v.comp||'no identificado')}. Se acumula por producto y por mes.`]);
 const pron=L.filter(l=>RAZ_VENTA.includes(l.motivo)&&l.m2);if(pron.length)r.push(['📦','Planeación',pron.map(fmL).join('<br>')+'<br>Se suma al pronóstico.']);
 if(v.proy&&!SIN_PROY.includes(v.proy))r.push(['🚀','Proyectos',`${v.proy==='Nuevo'?'Proyecto nuevo':'Proyecto'} → ${esc(v.pet||'etapa por confirmar')}. Se ve en la junta del lunes.`]);
 if(v.cob&&v.cob.startsWith('Compromiso'))r.push(['💰','Cobranza',`${esc(v.cob)}. Crédito lo ve sin pedir la nota del Excel.`]);
 r.push(['📅','Agenda',v.sig==='Nada por ahora'?'Sin siguiente paso.':`${esc(v.sig)} ${esc((v.cuando||'').toLowerCase())} · aparece en Mi semana.`]);
 r.push(['📊','Junta del lunes','El gerente lo ve sin pedir reporte.']);
 document.getElementById('scr').innerHTML=`<div class="done"><div class="ck">✓</div><div style="font-weight:800;font-size:16px">${esc(c.nombre)}</div><div style="font-size:12px;color:var(--mut)">${t} toques · ${[...he].filter(k=>M.some(([x])=>x.cli===k)).length} de ${M.length} clientes con visita esta semana</div></div>`+r.map(([i,ti,d])=>`<div class="route"><div class="ic">${i}</div><div><b>${ti}</b>${d}</div></div>`).join('');
 foot(`<button class="btn" onclick="siguiente()">Siguiente cliente</button>`)}
function siguiente(){const ag=AG(),he=hechosDe(EJ);const M=mis();
 const n=M.find(([c,i])=>i in ag&&!he.has(c.cli))||M.find(([c])=>!he.has(c.cli));if(n){cur=n[1];ir('resumen')}else ir('semana')}

 D.clientes.filter(c=>c.ej!==EJ&&real(c.ej)).forEach(c=>{if(!vis.has(c.cli)){vis.add(c.cli);out.push({cli:c.cli,nombre:c.nombre,ej:c.ej})}});
 (D.directorio||[]).forEach(c=>{if(!vis.has(c.cli)){vis.add(c.cli);out.push(c)}});return out}
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
function s5(){hdr('Agregar cliente','que no venía en tu lista',['semana','Mi semana']);document.getElementById('foot').classList.add('hide');
 if(NP){document.getElementById('scr').innerHTML=`<div class="q">Prospecto nuevo <small>no está en SAE</small></div>
<input class="t" id="np_n" placeholder="Nombre de la empresa" value="${esc(NP.nombre)}" oninput="NP.nombre=this.value">
<div class="q">Nota <small>opcional · ciudad, contacto, qué imprime</small></div><textarea class="t" rows="2" oninput="NP.nota=this.value">${esc(NP.nota)}</textarea>
<div style="height:12px"></div><button class="btn" onclick="agregaCli(null)">Agregar y registrar visita</button><div style="height:8px"></div><button class="addp" onclick="NP=null;s5()">‹ Mejor buscar en SAE</button>`;return}
 const q=norm(BQ).trim(),L=q.length<2?[]:candidatos().filter(c=>norm(c.nombre+' '+c.cli).includes(q)).slice(0,25);
 const e=document.getElementById('scr');e.innerHTML=`<div class="q">Busca por nombre o clave <small>clientes que compraron en GDL en 24 meses</small></div>
<input class="t" id="bq" placeholder="ej. Etipress o GD269" value="${esc(BQ)}" oninput="BQ=this.value;s5()" autocomplete="off">

<div style="height:10px"></div><button class="addp" onclick="NP={nombre:BQ,nota:''};s5()">+ No está: registrar prospecto nuevo</button>`;
 const i=document.getElementById('bq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
async function agregaCli(cli){let x;
 if(cli){const c=candidatos().find(c=>c.cli===cli);x={cli,nombre:c.nombre,ej:EJ,origen:'SAE',ej_sae:c.ej||'',ult:c.ult||null,nota:''}}
 else{const n=(NP.nombre||'').trim();if(n.length<3){toast('Escribe el nombre de la empresa');return}
  x={cli:'N-'+Date.now().toString(36).toUpperCase(),nombre:n,ej:EJ,origen:'Prospecto',ej_sae:'',nota:(NP.nota||'').trim()}}
 addExtra(x);cur=D.clientes.findIndex(c=>c.cli===x.cli&&c.ej===EJ);BQ='';NP=null;ls.set('bp_cache',{D,V,AGALL});
 try{const j=await api('agregarCliente',CLAVE,x);if(!j.ok)throw new Error(j.error);toast('Cliente agregado a tu lista')}
 catch(e){const q=ls.get('bp_cola_cli',[]);q.push(x);ls.set('bp_cola_cli',q);toast('Sin señal: se agrega al volver la señal')}
 ir('resumen')}
// ---------- 5 · Junta del lunes ----------
function hb(items,max,col,fmt,w=380){const h=items.length*24+4;return items.length?`<svg viewBox="0 0 ${w} ${h}" width="100%">${items.map(([l,v,c2],i)=>{const bw=Math.max(2,(w-200)*v/(max||1));return `<text x="0" y="${i*24+16}" font-size="11" fill="#39485a">${esc(String(l).slice(0,24))}</text><rect x="150" y="${i*24+5}" width="${bw}" height="14" rx="3" fill="${c2||col}"/><text x="${156+bw}" y="${i*24+16}" font-size="11" font-weight="700" fill="#10202e">${fmt(v)}</text>`}).join('')}</svg>`:'<div class="empty">Sin capturas todavía</div>'}
function dash(){const sel=document.getElementById('jej');const ejs=[...new Set(D.clientes.map(c=>c.ej))].filter(real);
 if(!sel.options.length)sel.innerHTML='<option value="">Ejecutivo: todos</option>'+ejs.concat([PRUEBA]).map(e=>`<option>${esc(e)}</option>`).join('');
 const fe=sel.value,CL=D.clientes.filter(c=>fe?c.ej===fe:real(c.ej)),cls=new Set(CL.map(c=>c.cli));
 const delEj=x=>fe?x.ej===fe:real(x.ej);
 const VV=V.filter(v=>cls.has(v.cli)&&delEj(v)),VS=VV.filter(enSemana),AGS=AGALL.filter(a=>cls.has(a.cli)&&delEj(a));
 document.getElementById('jsub').textContent=`semana ${SEM_TXT} · ${fe||ejs.length+' ejecutivos'} · datos de venta al ${fd(D.corte)} · ${VV.length} visitas capturadas`;
 const al=CL.filter(c=>ALT.includes(c.tipo)),pe=al.reduce((a,c)=>a+c.perd,0);
 const conCausa=al.filter(c=>VV.some(v=>v.cli===c.cli)).length;
 const lines=VV.flatMap(v=>v.lineas.map(l=>({...l,ej:v.ej,cli:v.cli})));
 const fmat=lines.filter(l=>l.motivo==='Falta de material');const fmTot=fmat.reduce((a,l)=>a+(+l.m2||0),0);
 const pron=lines.filter(l=>RAZ_VENTA.includes(l.motivo)&&l.mes&&l.mes!=='No sabe'&&l.mes!==NA);const m1=MESES_PROX[0];
 const he=new Set(VS.map(v=>v.cli));
 document.getElementById('dk').innerHTML=`<div><div class="l">Visitas hechas / planeadas</div><div class="dv">${he.size} / ${AGS.length}</div><div class="d">${AGS.length?Math.round(100*AGS.filter(a=>he.has(a.cli)).length/AGS.length):0} % de lo agendado se visitó</div></div>
<div><div class="l">Clientes en alerta</div><div class="dv">${al.length}</div><div class="d">${fm(pe)} por trimestre dejaron de entrar</div></div>
<div><div class="l">Alertas con causa</div><div class="dv">${conCausa} de ${al.length}</div><div class="d">meta: todas en ≤ 2 semanas</div></div>
<div><div class="l">Sin material</div><div class="dv" style="color:var(--amb)">${Math.round(fmTot/1e3).toLocaleString('es-MX')} mil m²</div><div class="d">${fmat.length} veces · ${new Set(fmat.map(l=>l.prod)).size} productos</div></div>
<div><div class="l">Próxima compra (${m1.toLowerCase()})</div><div class="dv">${Math.round(pron.filter(l=>l.mes===m1).reduce((a,l)=>a+(+l.m2||0),0)/1e3).toLocaleString('es-MX')} mil m²</div><div class="d">va a Planeación</div></div>`;
 const ej=(fe?[fe]:ejs).map(e=>{const c=D.clientes.filter(x=>x.ej===e);const ag=AGALL.filter(a=>a.ej===e).length;const h2=hechosDe(e).size;return `<tr><td><b>${esc(e)}</b></td><td class="n">${c.length}</td><td class="n" style="color:var(--red);font-weight:700">${c.filter(x=>ALT.includes(x.tipo)).length}</td><td class="n">${fm(c.reduce((a,x)=>a+(ALT.includes(x.tipo)?x.perd:0),0))}</td><td class="n">${c.filter(x=>x.tipo==='Creció fuerte').length}</td><td class="n">${h2} / ${ag}</td></tr>`}).join('');
 const R={};lines.forEach(l=>{if(l.motivo&&!RAZ_VENTA.includes(l.motivo)&&l.motivo!==NA)R[l.motivo]=(R[l.motivo]||0)+1});
 const ca=Object.entries(R).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v,k==='Falta de material'?'#c9963a':(RAZ_MALA.includes(k)?'#c0392b':'#9DC4D5')]);
 const P={};fmat.forEach(l=>P[l.prod]=(P[l.prod]||0)+(+l.m2||0));const fp=Object.entries(P).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>[k,v,'#c9963a']);
 const ms=MESES_PROX.slice(0,3);const tot={};pron.forEach(l=>tot[l.prod]=(tot[l.prod]||0)+(+l.m2||0));const prods=Object.entries(tot).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);const colp=['#0d1b2e','#009072','#9DC4D5'];
 const PX={};ms.forEach(m=>{PX[m]={};pron.filter(l=>l.mes===m).forEach(l=>PX[m][l.prod]=(PX[m][l.prod]||0)+(+l.m2||0)/1e3)});
 const sm=m=>Object.entries(PX[m]).filter(([p])=>prods.includes(p)).reduce((a,[,v])=>a+v,0);const mx=Math.max(1,...ms.map(sm));
 const stk=prods.length?`<svg viewBox="0 0 360 170" width="100%">${ms.map((m,i)=>{let y=140;return prods.map((p,j)=>{const h=(PX[m][p]||0)/mx*120;y-=h;return `<rect x="${40+i*105}" y="${y}" width="60" height="${h}" fill="${colp[j]}"/>`}).join('')+`<text x="${70+i*105}" y="156" font-size="11" text-anchor="middle" fill="#39485a">${m}</text><text x="${70+i*105}" y="${136-sm(m)/mx*120}" font-size="11" font-weight="700" text-anchor="middle">${Math.round(sm(m)).toLocaleString('es-MX')}</text>`}).join('')}</svg><div style="font-size:10.5px;color:var(--mut)">${prods.map((p,j)=>`<span style="display:inline-block;width:9px;height:9px;background:${colp[j]};margin:0 3px 0 8px"></span>${esc(p)}`).join('')} · miles de m²</div>`:'<div class="empty">Sin capturas todavía</div>';
 const top=al.slice().sort((a,b)=>b.perd-a.perd).slice(0,8);
 const alr=top.map(c=>{const v=VV.find(x=>x.cli===c.cli);const raz=v&&v.lineas.find(l=>l.motivo&&!RAZ_VENTA.includes(l.motivo)&&l.motivo!==NA);return `<tr><td><b>${esc(c.nombre)}</b><br><span style="color:var(--mut)">${esc(c.ej)}</span></td><td>${c.tipo==='Dejó de comprar'?c.dias+' días sin comprar':'cayó '+pc(c.vsP)}</td><td class="n">${fm(c.perd)}</td><td>${v?`<span class="badge b-grn">${esc(raz?raz.motivo:v.res)}</span>`:'<span class="badge b-red">sin causa</span>'}</td></tr>`}).join('');
 document.getElementById('dg').innerHTML=`<div class="pn"><h5>Por ejecutivo</h5><div class="k">clientes, alertas y visitas de la semana (hechas / agendadas)</div><table><tr><th>Ejecutivo</th><th class="n">Clientes</th><th class="n">Alertas</th><th class="n">$ / trim</th><th class="n">Crecieron</th><th class="n">Visitas</th></tr>${ej}</table></div>
<div class="pn"><h5>Por qué no compran</h5><div class="k">razón por producto capturada · rojo = le toca a otra área · ámbar = falta de material</div>${hb(ca,Math.max(1,...ca.map(x=>x[1])),'#9DC4D5',v=>v)}</div>
<div class="pn"><h5>Falta de material por producto</h5><div class="k">m² que el cliente quería y no había · para Compras</div>${hb(fp,Math.max(1,...fp.map(x=>x[1])),'#c9963a',v=>Math.round(v).toLocaleString('es-MX')+' m²')}</div>
<div class="pn"><h5>Próxima compra esperada</h5><div class="k">lo que dicen los ejecutivos → pedido a Colombia / China</div>${stk}</div>
<div class="pn" style="grid-column:span 2"><h5>Clientes en alerta: ¿ya sabemos por qué?</h5><div class="k">los 8 con más venta en juego · se pone verde cuando el ejecutivo captura la visita</div><table><tr><th>Cliente</th><th>Alerta</th><th class="n">$ / trim que dejó de entrar</th><th>Causa</th></tr>${alr||'<tr><td colspan=4>—</td></tr>'}</table></div>`}
function csv(){const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';const N={};D.clientes.forEach(c=>N[c.cli]=c.nombre);
 const rows=[['fecha','ejecutivo','cliente','nombre','tipo','resultado','producto','m2','razon','mes','competidor','proyecto','etapa','cobranza','siguiente','cuando','nota']];
 const fe=document.getElementById('jej').value;V.filter(v=>fe?v.ej===fe:real(v.ej)).forEach(v=>(v.lineas.length?v.lineas:[{}]).forEach(l=>rows.push([v.ts,v.ej,v.cli,N[v.cli],v.tipo,v.res,l.prod,l.m2,l.motivo,l.mes,v.comp,v.proy,v.pet,v.cob,v.sig,v.cuando,v.nota])));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='bp_gdl_'+iso(HOY)+'.csv';document.body.appendChild(a);a.click();a.remove()}
